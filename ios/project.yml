# SET для iPhone: нативная обёртка над веб-приложением из корня репозитория + виджеты.
# Сгенерировать проект: cd ios && xcodegen generate
# Веб-файлы (index.html, styles.css, app.js, icons/) при каждой сборке копируются в SET.app/Web
# скриптом Tools/copy-web.sh - править их надо в корне репозитория, отдельной копии для iOS нет.
name: SET

options:
  bundleIdPrefix: com.naumkogan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T9F5DY7ZHX
    MARKETING_VERSION: "0.9.10"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: NO

configs:
  Debug: debug
  Release: release

targets:
  SET:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: Shared
      - path: Web/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: SETWidgets
        embed: true
    preBuildScripts:
      - name: Copy web app
        script: bash "$SRCROOT/Tools/copy-web.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: SET
        PRODUCT_BUNDLE_IDENTIFIER: com.naumkogan.set
        # только iPhone: XcodeGen по умолчанию ставит таргету "1,2", а для iPad Apple требует все повороты (ITMS-90474)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/SET.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SET
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.naumkogan.set
            CFBundleURLSchemes:
              - setshoot
        LSApplicationQueriesSchemes:
          - tg
          - whatsapp
          - instagram
        NSCameraUsageDescription: SET открывает камеру, если вы хотите сфотографировать образ или референс прямо в проект.
        NSPhotoLibraryUsageDescription: SET открывает фото, которые вы выбираете для мудборда и образов.
        NSPhotoLibraryAddUsageDescription: SET сохраняет в Фото картинку с итогами съёмки, если вы попросите.
        # общая с виджетами связка ключей (см. Shared/Snapshot.swift, SharedStore)
        SETKeychainGroup: $(AppIdentifierPrefix)com.naumkogan.set.shared
  SETWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SETWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.naumkogan.set.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/SETWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: SET
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SETKeychainGroup: $(AppIdentifierPrefix)com.naumkogan.set.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
